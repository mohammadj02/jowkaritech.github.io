name: Design review
on:
  push:
    branches: [improve/professional-site-20261012]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: design-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned QA dependencies
        run: |
          pip install Pillow==11.3.0 playwright==1.55.0 beautifulsoup4==4.13.5
          python -m playwright install --with-deps chromium
      - name: Build editorial pages and apply reviewed corrections
        run: |
          python .github/scripts/prepare-design-assets.py
          python .github/scripts/build-editorial.py
          python .github/scripts/patch-studio.py
      - name: JavaScript syntax and model/server tests
        run: |
          node --check assets/site/site.js
          node --check lead.js
          node --check jowkari-sites/studio.mjs
          node --test tests/studio-core.test.mjs
      - name: Existing Studio end-to-end tests
        run: python tests/studio-browser.py
      - name: Design, enquiry and multi-device regression tests
        run: python tests/design-browser.py
      - name: Commit verified output only to the review branch
        run: |
          git config user.name 'JowkariTech design build'
          git config user.email '125791214+mohammadj02@users.noreply.github.com'
          git add assets/site index.html portfolio.html demo/roofing/index.html demo/plumbing/index.html demo/electrician/index.html jowkari-sites/studio.mjs jowkari-sites/core.mjs local-seo.css
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified editorial homepage, demos and Studio corrections'
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Export source snapshot
        if: always()
        run: git archive --format=zip HEAD -o source-review.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-review
          path: source-review.zip
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: professional-design-qa
          path: test-results/
          retention-days: 7
