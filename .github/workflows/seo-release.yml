name: Local search SEO validation
on:
  push:
    branches: [seo/local-search-20261012, main]
    paths:
      - '.github/scripts/seo-release.py'
      - '.github/workflows/seo-release.yml'
      - 'tests/seo-*.py'
      - 'seo-release.json'
      - 'seo.css'
      - 'seo-context.js'
      - 'services.html'
      - 'about.html'
      - 'contact.html'
      - 'small-business-website-checklist.html'
      - 'sitemap.xml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: seo-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned QA dependencies
        run: |
          pip install beautifulsoup4==4.13.5 playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Build SEO release on isolated branch
        if: github.ref == 'refs/heads/seo/local-search-20261012'
        run: |
          if [ ! -f seo-release.json ]; then
            python .github/scripts/seo-release.py build
          fi
      - name: Verify public pages, links, schema, sitemap and preserved applications
        run: |
          python .github/scripts/seo-release.py verify
          node --check seo-context.js
          node --check jowkari-sites/studio.mjs
          node --test tests/studio-core.test.mjs
      - name: Existing Studio upload, editing, preview and export checks
        run: python tests/studio-browser.py
      - name: Responsive SEO, navigation, attribution and contact checks
        run: python tests/seo-browser.py
      - name: Commit only verified generated files to SEO branch
        if: github.ref == 'refs/heads/seo/local-search-20261012'
        run: |
          git config user.name 'JowkariTech release build'
          git config user.email '125791214+mohammadj02@users.noreply.github.com'
          python - <<'PY'
          import json, subprocess
          manifest=json.load(open('seo-release.json'))
          subprocess.run(['git','add','--',*manifest['changed_files'],'seo-release.json'],check=True)
          PY
          if ! git diff --cached --quiet; then
            git commit -m 'Improve service discovery, factual local content and unified search metadata'
            git push origin HEAD:seo/local-search-20261012
          fi
      - name: Export verified source snapshot
        if: success()
        run: git archive --format=zip HEAD -o seo-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-search-qa
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: local-search-source
          path: seo-source.zip
          retention-days: 2
  live-verification:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4==4.13.5
      - name: Read-only production SEO checks
        run: python tests/seo-live.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-search-production
          path: test-results/seo-live/
          retention-days: 7
