name: Studio checks and preview deployment
on:
  push:
    branches: [main, fix/website-studio-20261012]
    paths:
      - 'jowkari-sites/**'
      - 'cloudflare/preview-worker.js'
      - 'cloudflare/prepare-preview-deploy.py'
      - 'tests/studio*'
      - '.github/workflows/studio-release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'jowkari-sites/**'
      - 'cloudflare/preview-worker.js'
      - 'tests/studio*'
      - '.github/workflows/studio-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and model/server regression tests
        run: |
          node --check jowkari-sites/core.mjs
          node --check jowkari-sites/studio.mjs
          node --test tests/studio-core.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Desktop and mobile browser regression tests
        run: python tests/studio-browser.py
      - name: Save browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-qa
          path: test-results/studio/
          retention-days: 7
  deploy-preview:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve or create the preview KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 cloudflare/prepare-preview-deploy.py
      - name: Deploy preview Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy --config cloudflare/wrangler.preview.runtime.json
      - name: Verify live image preview storage and remove synthetic test
        run: python3 tests/studio-live-preview.py
